name: CI Pipeline (Lint -> Test -> Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Executar Lint (Flake8)
        run: |
          # Falha o pipeline apenas em erros graves (sintaxe quebrada, nomes indefinidos)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Executar Testes (Pytest)
        run: |
          pytest

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Testar Build da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Apenas valida se o build compila com sucesso no pipeline
          tags: fastapi_triagem:test
