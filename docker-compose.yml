

services:
  # ==========================================
  # Serviços da Etapa 3: API e Observabilidade
  # ==========================================
  api:
    build: .
    container_name: fastapi_triagem
    ports:
      - "8001:8001"
    restart: unless-stopped
    # Limite de segurança de RAM para a API
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_metrics
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboards
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M