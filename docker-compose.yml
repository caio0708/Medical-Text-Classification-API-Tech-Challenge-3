

services:
  # ==========================================
  # Serviços da Etapa 3: API e Observabilidade
  # ==========================================
  api:
    build: .
    container_name: fastapi_triagem
    ports:
      - "8001:8001"
    restart: unless-stopped
    # Limite de segurança de RAM para a API
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_metrics
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboards
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Permite que o provider de dashboards sobrescreva edições feitas na UI
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/api_triagem_dashboard.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M

  airflow:
    image: apache/airflow:2.9.3
    container_name: airflow_standalone

    command: >
      bash -c "
        pip install --no-cache-dir pandas scikit-learn joblib &&
        echo '=========================================' &&
        echo '       AIRFLOW ADMIN CREDENTIALS' &&
        echo '=========================================' &&
        echo 'Username: admin' &&
        echo 'Password: admin' &&
        echo 'URL: http://localhost:8080' &&
        echo '=========================================' &&
        airflow standalone
      "

    ports:
      - "8080:8080"

    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin

    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models

    deploy:
      resources:
        limits:
          memory: 1G

    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
